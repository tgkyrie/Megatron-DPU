name: build-megascale_ps

on:
  push:
    branches: [main, wpb_megascale_ps]
    paths:
      - "Dockerfile.megascale_ps"
      - "megascale_ps/**"
      - ".github/workflows/build-megascale_ps.yml"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_MEGASCALE_PS: ghcr.io/${{ github.repository_owner }}/megascale_ps
      IMAGE_MEGATRON: ghcr.io/${{ github.repository_owner }}/megascale_ps-megatron
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/powershell /opt/hostedtoolcache || true
          docker system prune -af || true
          df -h

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.megascale_ps
          push: true
          tags: |
            ${{ env.IMAGE_MEGASCALE_PS }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 仅构建 MegaScalePS 镜像；Megatron 镜像在 build-megatron.yml
